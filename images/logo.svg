<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A0B13" />
      <stop offset="60%" stop-color="#280408" />
      <stop offset="100%" stop-color="#140104" />
    </radialGradient>
    
    <!-- Flame Gradient -->
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F5E0CD" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A8" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <!-- Shadow Effect -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Main Background Container -->
  <rect x="20" y="20" width="460" height="460" rx="64" fill="url(#bg-grad)" stroke="#5A121C" stroke-width="4"/>

  <!-- Inner Subtle Glow Border -->
  <rect x="30" y="30" width="440" height="440" rx="54" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.3"/>

  <g transform="translate(0, 10)">
    <!-- Stylized Flame Icon -->
    <g filter="url(#drop-shadow)" transform="translate(250, 125) scale(1.15)">
      <!-- Outer Flame -->
      <path d="M 0 -55 C 22 -35, 36 -10, 36 18 C 36 45, 18 60, 0 60 C -18 60, -36 45, -36 18 C -36 -10, -22 -35, 0 -55 Z" fill="url(#flame-grad)" />
      <!-- Inner Flame Cutout / Detail -->
      <path d="M 0 -35 C 12 -20, 20 -4, 20 16 C 20 32, 10 42, 0 42 C -20 42, -20 32, -20 16 C -20 -4, -12 -20, 0 -35 Z" fill="#280408" />
      <path d="M 2 -20 C 8 -10, 12 0, 12 12 C 12 24, 6 30, 0 30 C -6 30, -12 24, -12 12 C -12 0, -6 -10, 2 -20 Z" fill="url(#flame-grad)" />
    </g>

    <!-- Primary Title: Balnex -->
    <text x="250" y="270" text-anchor="middle" font-family="'Playfair Display', 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#FFFFFF" letter-spacing="1.5" filter="url(#drop-shadow)">Balnex</text>

    <!-- Subtitle: KITCHEN -->
    <text x="250" y="315" text-anchor="middle" font-family="'Raleway', 'Arial', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="8">KITCHEN</text>

    <!-- Banner Box for Multi Cuisine Restaurant -->
    <g transform="translate(75, 350)">
      <rect x="0" y="0" width="350" height="42" rx="6" fill="#FFFFFF" stroke="url(#gold-grad)" stroke-width="2" filter="url(#drop-shadow)"/>
      <text x="175" y="27" text-anchor="middle" font-family="'Raleway', 'Arial', sans-serif" font-size="16" font-weight="900" fill="#280408" letter-spacing="2">MULTI CUISINE RESTAURANT</text>
    </g>
  </g>
</svg>
